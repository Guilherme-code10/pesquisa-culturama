<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Unbounded:wght@200..900&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>
<body>
 <main>
        <header>
            <img src="img/logo-culturama.png" alt="logo culturama">
            <h1>Pesquisa de opinião</h1>
        </header>
        <section>
            <form action="sucesso.html" method="get">
                <fieldset> 

                        <legend>Dados pessoais</legend>
                        <label for="name">Nome</label>    
                        <input id="name" type="text" name="userName" placeholder="Digite seu nome" required>
                        <br>
                        <label for="age">Idade</label>
                        <input id="age" type="number" name="userage" min="12" max="100" required>
                        <br>
                        <label for="birthDate">Data de nascimento</label>
                        <input id="birthDate" type="date" name="userBirthDate" >
                        <br>
                        <label for="email">Email</label>
                        <input id="email" type="email" name="userEmail" placeholder="Digite seu email" required>
                        <br>
                        <label for="phoneNumber">Telefone</label>
                        <input id="phoneNumber" type="tel" name="userPhone" placeholder="DDD + Número sem espaços ou hífen" aria-describedby="phoneHelp" pattern="[0-9]{11}">
                        <small id="phoneHelp">Preencha com 11 dígitos no formato: DDD + Número sem espaços ou hífen </small>
                        <br>
                        <label for="image">Upload de foto</label>
                        <input id="image" type="file" name="userImage" accept="image/*" aria-describedby="imagemHelp">
                        <small id="imagemHelp">Envie uma foto no formato PNG ou JPG</small>
                        <br>
                                
                </fieldset> 

                <fieldset>
                    <legend>Perfil</legend>

                    <p>Gênero:</p>
                    <input id="fem" type="radio" name="userGender"
                    value="feminino">  
                    <label for="fem">Feminino</label>

                    <input id="masc" type="radio" name="userGender"
                    value="masculino">  
                    <label for="masc">Masculino</label>

                    <input id="notInformed" type="radio" name="userGender"
                    value="notInformed">  
                    <label for="notInformed">Prefiro não informar</label>
                    <br>

                    <label for="maritalStatus">Estado civil:</label>
                    <select id="maritalStatus" name="userMaritalStatus">
                        <option value="notInformed">Selecione...</option>
                        <option value="casado">Casado(a)</option>
                        <option value="solteiro">Solteiro(a)</option>   
                        <option value="divorciado">Divorciado(a)</option>
                        <option value="uniãoEstavel">União estável</option>
                    </select>

                    <label for="state">Estado:</label>
                    <select id="state" name="userState" required>     
                        <option value="notInformed">Selecione...</option>           
                        <option value="alagoas">Alagoas </option>
                        <option value="amapa">Amapá </option>
                        <option value="amazonas">Amazonas </option>
                        <option value="bahia">Bahia </option>
                        <option value="ceara">Ceará </option>
                        <option value="distritoFederal">Distrito Federal </option>
                        <option value="espiritoSanto">Espirito Santo </option>
                        <option value="goias">Goiás </option>
                        <option value="maranhao">Maranhão </option>
                        <option value="matoGrossoDoSul">Mato Grosso do Sul </option>
                        <option value="matoGrosso">Mato Grosso </option>
                        <option value="minasGerais">Minas Gerais </option>
                        <option value="para">Pará </option>
                        <option value="paraiba">Paraíba </option>
                        <option value="parana">Paraná </option>
                        <option value="pernambuco">Pernambuco </option>
                        <option value="piaui">Piauí </option>
                        <option value="rioDeJaneiro">Rio de Janeiro </option>
                        <option value="rioGrandeDoNorte">Rio Grande do Norte </option>
                        <option value="rioGrandeDoSul">Rio Grande do Sul </option>
                        <option value="rondonia">Rondônia </option>
                        <option value="roraima">Roraima </option>
                        <option value="santaCatarina">Santa Catarina </option>
                        <option value="saoPaulo">São Paulo </option>
                        <option value="sergipe">Sergipe </option>
                        <option value="tocantins">Tocantins </option>  

                    </select>     
                    <br>
                    <label for="city">Cidade:</label>
                    <input id="city" type="text" name="userCity"
                    placeholder="Digite sua cidade">                
                        
                </fieldset>

                <fieldset>
                    <Legend>Hábitos</Legend>
                    <p>Redes Sociais:</p>
                    <input id="instagram" type="checkbox" name="social" value="instagram">
                    <label for="instagram">Instagram</label>
                    <br>
                    <input id="facebook" type="checkbox" name="social" value="facebook">
                    <label for="facebook">Facebook</label>
                    <br>
                    <input id="linkedin" type="checkbox" name="social" value="Linkedin">
                    <label for="linkedin">Linkedin</label>
                    <br>
                    <input id="x" type="checkbox" name="social" value="X">
                    <label for="x">X</label>
                    <br>

                    <label for="musicStyle">Estilo musical:</label>
                    <input list="styleTypes" id="musicStyle" type="text" name="userMusicStyle">
                    <datalist id="styleTypes">
                        <option value="Rock"></option>
                        <option value="Pop"></option>
                        <option value="Sertanejo"></option>
                        <option value="Forro"></option>
                        <option value="Pagode"></option>
                        <option value="Samba"></option>
                        <option value="Funk"></option>
                        <option value="HipHop"></option>
                        <option value="Eletronica"></option>
                    </datalist>
                    <br>
                    <label for="favoriteColor">Cor favorita:</label>
                    <input type="color" name="userFavoriteColor" id="favoriteColor">
                    
                </fieldset>

            <fieldset>
                <legend>Opinião</legend>
                <p>O que você acha da qualidade do nosso serviço?</p>
                
                <input type="radio" id="otimo"  name="userServiceOpinion" value="otima">
                <label for="otimo">Ótima</label><br>

                <input type="radio" id="boa" name="userServiceOpinion" value="boa">
                <label for="boa">Boa</label><br>

                <input type="radio" id="regular" name="userServiceOpinion" value="regular">
                <label for="regular">Regular</label><br>

                <input type="radio" id="ruim"  name="userServiceOpinion" value="ruim">
                <label for="ruim">Ruim</label><br>

                <label for="comment">Escreva sua opinião:</label>
                <textarea id="comment" name="userComment"            placeholder="Digite aqui sua opinião..."></textarea>

                </fieldset>

                <fieldset>
                    <legend>Confirmações</legend>
                    <input type="checkbox" id="userLgpdTerm" name="userLgpd" value="accepted" required>
                    <label for="userLgpdTerm">Eu aceito participar da pesquisa</label><br>

                    <input type="checkbox" id="userGetResult" name="getResult" value="accepted" required>
                    <label for="userGetResult">Eu aceito receber os resultados por email.</label>

                </fieldset>






                <button type="submit" aria-label="Enviar dados do formulário">Enviar</button>
                <button type="reset" aria-label="Limpar dados do formulário">Limpar</button>
            </form>

        </section>
    </main>
</body>
</html>
